<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>I GUIDE U – Frontend simple</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f3f4f6;
      margin: 0;
      padding: 24px;
    }
    .card {
      max-width: 720px;
      margin: 0 auto;
      background: #ffffff;
      border-radius: 18px;
      padding: 20px 22px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.06);
    }
    h1 {
      margin-top: 0;
      font-size: 1.4rem;
    }
    .subtitle {
      margin: 6px 0 18px;
      color: #4b5563;
      font-size: 0.95rem;
    }
    .buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 14px;
    }
    button {
      border-radius: 999px;
      border: none;
      padding: 8px 14px;
      cursor: pointer;
      font-size: 0.9rem;
      font-weight: 500;
      background: #111827;
      color: #ffffff;
    }
    #log {
      background: #111827;
      color: #e5e7eb;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      font-size: 0.8rem;
      padding: 10px;
      border-radius: 12px;
      max-height: 260px;
      overflow-y: auto;
      white-space: pre-wrap;
    }
    .guides-list {
      margin-top: 14px;
      border-top: 1px solid #e5e7eb;
      padding-top: 10px;
      font-size: 0.9rem;
    }
    .guide {
      margin-bottom: 8px;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>I GUIDE U – Frontend simple</h1>
    <div class="subtitle">
      Conectado al backend local en <strong>http://127.0.0.1:4026</strong>.
    </div>

    <div class="buttons">
      <button id="btnHealth">Ver estado del backend</button>
      <button id="btnGuides">Cargar guías</button>
      <button id="btnCheckout">Test pago Stripe (USD 10)</button>
    </div>

    <pre id="log">[log] Frontend simple cargado. Probá los botones de arriba.</pre>

    <div class="guides-list" id="guidesList"></div>
  </div>

  <script>
    const logEl = document.getElementById("log");
    const guidesEl = document.getElementById("guidesList");

    function logLine(msg) {
      const now = new Date();
      const hh = String(now.getHours()).padStart(2, "0");
      const mm = String(now.getMinutes()).padStart(2, "0");
      const ss = String(now.getSeconds()).padStart(2, "0");
      logEl.textContent += `\n[${hh}:${mm}:${ss}] ${msg}`;
      logEl.scrollTop = logEl.scrollHeight;
    }

    async function checkHealth() {
      try {
        logLine("[INFO] Consultando /api/health ...");
        const res = await fetch("http://127.0.0.1:4026/api/health");
        const data = await res.json();
        logLine("[OK] Health: " + JSON.stringify(data));
      } catch (err) {
        logLine("[ERROR] /api/health: " + err.message);
      }
    }

    async function loadGuides() {
      try {
        logLine("[INFO] Cargando guías desde /api/guides ...");
        const res = await fetch("http://127.0.0.1:4026/api/guides");
        const data = await res.json();

        // Backend responde { ok: true, guides: [...] }
        const guides = Array.isArray(data.guides) ? data.guides : data;

        if (!Array.isArray(guides) || guides.length === 0) {
          logLine("[WARN] No se encontraron guías (lista vacía).");
          guidesEl.innerHTML = "<em>No hay guías para mostrar.</em>";
          return;
        }

        logLine("[OK] Guías cargadas: " + guides.length);
        guidesEl.innerHTML = guides
          .map((g) => {
            return `
              <div class="guide">
                <strong>${g.code} – ${g.name}</strong><br />
                ${g.city}, ${g.country} – 💲 ${g.hourlyRate} / hora – ${g.dailyRate} / día – ⭐ ${g.rating}
              </div>
            `;
          })
          .join("");
      } catch (err) {
        logLine("[ERROR] /api/guides: " + err.message);
      }
    }

    async function testCheckout() {
      try {
        logLine("[INFO] Creando Checkout Stripe (USD 10) ...");
        const res = await fetch("http://127.0.0.1:4026/api/payments/create-checkout", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
          },
          body: JSON.stringify({
            guideId: "g1001",
            userEmail: "tmlozz27@gmail.com",
            amountUSD: 10,
          }),
        });

        const data = await res.json();
        if (!data.ok || !data.url) {
          logLine("[ERROR] El backend respondió sin URL válida: " + JSON.stringify(data));
          return;
        }

        logLine("[OK] Checkout creado. Abriendo Stripe...");
        window.open(data.url, "_blank");
      } catch (err) {
        logLine("[ERROR] /api/payments/create-checkout: " + err.message);
      }
    }

    document.getElementById("btnHealth").addEventListener("click", checkHealth);
    document.getElementById("btnGuides").addEventListener("click", loadGuides);
    document.getElementById("btnCheckout").addEventListener("click", testCheckout);
  </script>
</body>
</html>
